<!DOCTYPE html>
<html>
<head>
  <title>Audio Test</title>
</head>
<body>
  <button id="startAudio">Start</button>
  <button id="stopAudio">Stop</button>
  <button id="bubble">Bubble</button>
  <button id="lazer">Lazer</button>

  <script src="audio.js"></script>

  <script>
    const audioManager = new AudioManager({
      bubble: "./assets/audio/bubble.mp3",
      catching_sandwich: "./assets/audio/catching_sandwich.mp3",
      cicada_hit: "./assets/audio/cicada_hit.mp3",
      cicada_swarm: "./assets/audio/cicada_swarm.mp3",
      game_over: "./assets/audio/game_over.mp3",
      health_short: "./assets/audio/health_short.mp3",
      health: "./assets/audio/health.mp3",
      lazer_short: "./assets/audio/lazer_short.mp3",
      lazer: "./assets/audio/lazer.mp3",
      tick: "./assets/audio/time_tick.mp3",
      turtle_hit: "./assets/audio/turtle_hit.mp3",
      vending_rising: "./assets/audio/vending_rising.mp3",
    }, 4);

    async function init() {
      // Init on game
      await audioManager.resume();  // Must be triggered by user gesture
      await audioManager.loadAll();

      // Now enable the UI
      document.getElementById("startAudio").addEventListener("click", () => {
        audioManager.playMusicLoop("./assets/audio/mario.mp3");

        for (let i = 0; i < 11; i++) {
          setTimeout(() => {
            audioManager.playSample("tick", {
              gain: 1,
              pan: 0,
              throttleMs: 300
            });
          }, i*1000);
        }
      });

      document.getElementById("bubble").addEventListener("click", () => {
        audioManager.playSample("bubble", {
          gain: 0.6,
          pan: 0,
          pitchRandom: [0.95, 1.05]
        });
      });

      document.getElementById("lazer").addEventListener("click", () => {
        audioManager.playSample("lazer", {
          gain: 0.6,
          pan: 0.1,
          pitchRandom: [0.95, 1.05]
        });
      });

      document.getElementById("stopAudio").addEventListener("click", () => {
        audioManager.stopMusic();
      });
    }

    // Safari requires resume/load to be triggered by user gesture, so call init only after click
    document.getElementById("startAudio").addEventListener("click", () => {
      init();
    }, { once: true }); // ensure it's only called once
  </script>
</body>
</html>
