<!DOCTYPE html>
<html>
<head>
  <title>Space Invaders</title>
  <style>
    #game-area {
      width: 500px;
      height: 600px;
      background-color: #000;
      position: relative;
      overflow: hidden;
    }

    #spaceship {
      width: 50px;
      height: 50px;
      background-color: #0f0;
      position: absolute;
      bottom: 10px;
      left: 225px; /* Start in the middle */
    }
  </style>
</head>
<body>

  <div id="game-area">
    <div id="spaceship"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
