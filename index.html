<!DOCTYPE html>
<html>

<head>
  <title>Space Invaders</title>
  <link rel="stylesheet" href="style.css">

  </style>
</head>

<body>
  <!--GAME AREA-->
  <div id="game-area">
    <div id="score">Score: 0</div>
    <div id="lives">Lives: 5</div>

    <div id="mario-img-cont">
      
      <img class="mario-img" id="mario-legs0" src="assets/mario/legs0.png"></img>
      <img class="mario-img" id="mario-legs1" src="assets/mario/legs1.png"></img>
      <img class="mario-img" id="mario-legs2" src="assets/mario/legs2.png"></img>
      <img class="mario-img" id="mario-legs3" src="assets/mario/legs3.png"></img>
      <img class="mario-img" id="mario-legs-crouch" src="assets/mario/legs_crouch.png"></img>
      <img class="mario-img" id="mario-legs-jump" src="assets/mario/legs_jump.png"></img>
      <img class="mario-img" id="mario-legs-falling" src="assets/mario/legs_falling.png"></img>
      <img class="mario-img" id="mario-body-forward" src="assets/mario/body_forward.png"></img>
      <img class="mario-img" id="mario-body-up" src="assets/mario/body_up.png"></img>
      <img class="mario-img" id="mario-body-crouch-forward" src="assets/mario/body_crouch_forward.png"></img>
      <img class="mario-img" id="mario-body-crouch-up" src="assets/mario/body_crouch_up.png"></img>
    </div>
         
    <div id="debug-visuals"></div>
    <div id="spaceship"></div>
    <div id="mario"></div>
  </div>

  <!--MAIN MENU-->
  <div id="main-menu" class="menu-container">
<h2> El Mario vs Space Invaders</h2>
<button id="play-button">Play</button>
<button id="leaderboard-button">Leaderboard</button>
<button id="main-mute-button"> Mute Sound </button>
  </div>

  <!--PAUSE MENU-->
  <div id="pause-menu" class="menu-container hidden">
  <h2>Paused</h2>
  <button id="resume-button">Resume</button>
  <button id="restart-button">Restart</button>
  <button id="back-to-menu-button">Back to Menu</button>
  <button id="pause-mute-button">Mute Sound</button>
  </div>

  <!--GAME OVER MENU-->
  <div id = "game-over-menu" class="menu-container hidden">
    <h2>Game Over</h2>
    <button id="restart-button">Restart</button>
    <button id="back-to-menu-button">Back to Menu</button>
    <button id="game-over-mute-button">Mute Sound</button>
  </div> 

  <script type="module" src="game.js"></script>
</body>

</html>
